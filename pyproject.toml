[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "vat-number-validator"
version = "0.1.0"
description = "Offline VAT number validation (EU-27, XI, GB, CH, NO) with an optional VIES existence check, Django and Pydantic integrations."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "Egbavou" }]
keywords = ["vat", "vat-number", "vies", "tva", "eu", "validation", "django", "pydantic"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Framework :: Pydantic :: 2",
    "Typing :: Typed",
    "Natural Language :: English",
    "Natural Language :: French",
]

[project.optional-dependencies]
httpx = ["httpx>=0.27"]
django = ["Django>=5.2"]
pydantic = ["pydantic>=2.0.1,<3"]

[dependency-groups]
test = ["pytest>=8.3", "python-stdnum>=2.2", "babel>=2.16"]
typing = ["mypy>=1.13", "django-stubs>=5.1"]
lint = ["ruff>=0.8"]

[tool.uv]
default-groups = ["test", "typing", "lint"]

[tool.hatch.build.targets.wheel]
packages = ["src/vat_number_validator"]

[tool.hatch.build.targets.sdist]
exclude = ["/docs", "/.github"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --strict-markers --strict-config -ra -m 'not live and not parity'"
markers = [
    "live: calls the real VIES service (needs VAT_NUMBER_VALIDATOR_LIVE=1)",
    "parity: differential test against the local PHP package",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.mypy]
strict = true
files = ["src", "tests"]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "tests.django_integration.settings"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "PT", "RUF", "RET"]

[tool.ruff.format]
